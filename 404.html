<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Showcase · 404</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF9F5">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..700&family=Sacramento&family=Archivo:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--canvas:#FBF9F5;--ink:#16130F;--ink-soft:#6B6358;--four:#3A3835;--gutter:clamp(16px,4vw,56px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font-family:Archivo,system-ui,sans-serif;overflow:hidden}
a{color:inherit}
.nav{position:fixed;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:22px var(--gutter);z-index:5}
.mark{font:300 clamp(18px,1.5vw,22px)/1 Jost,sans-serif;letter-spacing:.2em;text-decoration:none;text-transform:uppercase}
.mark b{font-weight:500}.mark i{font-style:normal;font-weight:300}
.pill{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:99px;background:var(--ink);color:var(--canvas);text-decoration:none;font:600 14px/1 Archivo,sans-serif;transition:background .25s}
.pill:hover{background:#3A342C}
.tag{position:fixed;right:var(--gutter);bottom:22px;font:12px/1 Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);z-index:5}
.lede{position:fixed;left:var(--gutter);bottom:22px;margin:0;font:13px/1.4 Archivo,sans-serif;color:var(--ink-soft);z-index:5;max-width:46ch}
.lede em{font:italic 1.25em/1 "Instrument Serif",serif;color:var(--ink)}

/* 4 · emoji · 4 */
.stage{position:fixed;inset:0;display:grid;place-items:center}
.code{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(0px,1vw,16px);transform:translateY(-6vh)}
.four{width:clamp(130px,22vw,360px);height:auto;display:block;color:var(--four)}
.four--r{margin-left:-2vw}
.code{perspective:900px}
.four{transform-style:preserve-3d;will-change:transform;filter:drop-shadow(0 18px 22px rgba(22,19,15,.10))}
.smoke{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.stage{z-index:1}
/* the home page cursor */
.cur{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:0;transition:opacity .18s}
.cur[data-on="1"]{opacity:1}
.cur__body{display:block;width:30px;height:26px;transform-origin:92% 50%}
.cur__body svg{width:100%;height:100%;overflow:visible;display:block}
html.has-cur:not(.cur-native),html.has-cur:not(.cur-native) *{cursor:none!important}
.pill{position:relative;overflow:hidden;isolation:isolate}
.pill::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 25%,rgba(255,255,255,.55) 50%,transparent 75%);transform:translateX(-130%);pointer-events:none}
.pill.is-lit::after{transform:translateX(130%);transition:transform .7s cubic-bezier(.23,1,.32,1)}
.pill.is-lit{background:#3A342C;box-shadow:0 10px 26px -12px rgba(22,19,15,.55)}
.zero{position:relative;width:clamp(140px,20vw,330px);aspect-ratio:1;display:grid;place-items:center;perspective:600px;z-index:2}
.zero > #emo{font-size:clamp(125px,17.5vw,290px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;will-change:transform}

/* names flow from under the emoji down past the bottom of the screen */
.flow{position:fixed;left:50%;top:0;bottom:0;width:min(90vw,700px);transform:translateX(-50%);pointer-events:none;z-index:1;overflow:hidden}
.name{position:absolute;left:50%;top:0;white-space:nowrap;font:500 clamp(18px,1.7vw,26px)/1 Jost,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);opacity:0;will-change:transform,opacity,filter}

@media (max-width:860px){
  .code{transform:translateY(-10vh)}
  .four{width:28vw}.zero{width:28vw}.zero > #emo{font-size:25vw}
  .zero .word{width:34vw;top:-8vw}
  .lede{right:var(--gutter);bottom:54px}
  .name{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.name{filter:none!important}}
/* "error" is one continuous pen line; the pen traces it from the first stroke of the e to the tail of the last r */
.zero .word{position:absolute;left:50%;top:clamp(-120px,-6.6vw,-48px);translate:-50% 0;width:clamp(170px,22vw,360px);height:auto;overflow:visible;pointer-events:none}
.zero .word path{fill:none;stroke:var(--ink);stroke-width:9.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
@media (prefers-reduced-motion:reduce){.zero .word path{stroke-dashoffset:0}}
</style>
</head>
<body>
<header class="nav">
  <a class="mark" href="./" aria-label="Showcase, home"><b>SHOW</b><i>CASE</i></a>
  <a class="pill" href="./">Back to Showcase <span aria-hidden="true">→</span></a>
</header>

<main class="stage" aria-labelledby="t">
  <h1 id="t" class="code" aria-label="Error 404: this page does not exist">
    <svg class="four" viewBox="30 90 500 700" aria-hidden="true"><use href="#glyph4"/></svg>
    <span class="zero" aria-hidden="true"><svg class="word" id="word" viewBox="0 30 440 110" aria-hidden="true"><path pathLength="1" d="M12,110 C40,104 70,88 72,72 C74,58 58,52 48,60 C34,72 30,98 44,110 C56,120 78,116 92,102 C99,92 102,76 104,60 C108,66 112,70 118,70 C123,70 126,66 128,62 C128,76 126,98 132,106 C137,113 152,112 166,104 C172,100 176,94 178,90 C181,82 184,72 186,60 C190,66 194,70 200,70 C205,70 208,66 210,62 C210,76 208,98 214,106 C219,113 236,112 252,102 C256,98 258,94 260,90 C264,76 272,66 288,65 C305,64 314,80 310,96 C306,111 287,117 276,107 C267,99 271,84 285,79 C298,74 310,72 320,73 C326,74 330,70 332,62 C336,68 340,72 346,72 C352,72 355,67 358,62 C358,78 356,98 362,106 C368,113 388,112 404,103 C412,98 420,94 428,90"/></svg><span id="emo">💅</span></span>
    <svg class="four four--r" viewBox="30 90 500 700" aria-hidden="true"><use href="#glyph4"/></svg>
  </h1>
</main>
<div class="flow" id="flow" aria-hidden="true"></div>
<canvas class="smoke" id="smoke" aria-hidden="true"></canvas>
<div class="cur" id="cur" aria-hidden="true"><span class="cur__body" id="curBody"><svg viewBox="0 0 30 26"><path d="M28.4 11.6c1.1.6 1.1 2.2 0 2.8L4.6 25.2c-1.5.7-3-.8-2.4-2.3L6.4 13.6c.2-.4.2-.8 0-1.2L2.2 3.1C1.6 1.6 3.1.1 4.6.8l23.8 10.8Z" fill="#16130F" stroke="#FBF9F5" stroke-width="1.4" stroke-linejoin="round"/></svg></span></div>

<p class="lede">This page leads nowhere, the demo is a design study. <em>Your</em> real one would take bookings.</p>
<span class="tag">Error 404</span>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- a blackletter "4": hairline diagonal, broad stem, slanted bar, blade and a hairline tail -->
  <symbol id="glyph4" viewBox="30 90 500 700">
    <g fill="currentColor" stroke="currentColor">
      <path d="M430 103 L123 459" fill="none" stroke-width="2"/>
      <path d="M337 212 L430 103 L430 600 L337 574 Z" stroke="none"/>
      <path d="M123 459 L337 459 L247 541 L44 541 Z" stroke="none"/>
      <path d="M337 574 L495 618 L406 703 L293 653 Z" stroke="none"/>
      <path d="M296 654 C250 668 218 700 226 732 C233 757 248 770 264 780" fill="none" stroke-width="1.8"/>
      <path d="M466 498 C505 520 510 575 494 600" fill="none" stroke-width="1.8"/>
    </g>
  </symbol>
</svg>

<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* write "error" with a pen, hold it, lift it away, write it again, forever */
(() => {
  const w = document.getElementById('word'), line = w.querySelector('path'); if (reduce) return;
  function cycle(){
    w.style.opacity = 1; w.style.filter = 'none';
    line.animate([{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 2600, easing: 'cubic-bezier(.45,.1,.35,1)', fill: 'forwards' })
      .onfinish = () => setTimeout(() => {
        w.animate([{ opacity: 1, filter: 'blur(0)' }, { opacity: 0, filter: 'blur(6px)' }], { duration: 600, easing: 'ease-in', fill: 'forwards' })
          .onfinish = () => { line.getAnimations().forEach(a => a.cancel()); w.getAnimations().forEach(a => a.cancel()); setTimeout(cycle, 350); };
      }, 2200);
  }
  setTimeout(cycle, 500);
})();

/* the 0 cycles through what our clients sell, exactly like the hero O */
const EMOJI = ['💅','🍣','🍕','🥐','🍰','🍸','🍷','☕','🍛','🍵','🔑','🧘','🛋️','🧁'];
const emo = document.getElementById('emo'); let emoI = 0;
if (!reduce) setInterval(() => {
  emo.animate([{ transform: 'rotateY(0deg) scale(1)' }, { transform: 'rotateY(90deg) scale(.85)' }], { duration: 170, easing: 'ease-in' }).onfinish = () => {
    emo.textContent = EMOJI[++emoI % EMOJI.length];
    emo.animate([{ transform: 'rotateY(-90deg) scale(.85)' }, { transform: 'rotateY(0deg) scale(1)' }], { duration: 260, easing: 'cubic-bezier(.23,1,.32,1)' });
  };
}, 900);

/* every site we made drifts down from under the emoji:
   blurred and faint → sharp → slides on → blurs out and disappears */
const NAMES = ['Jacarandá','Alizé','Kohl','Firouz','Atelier Nour','Zvezda Beauté','Le 41','Maison Sirocco','Bottega Partenope','Sōlen Wellness','Kaze Sushi','Le Huitième','Nacre','Dar Ambar','Kumo Café','Nagi','Lumi by Sana','Le Petit Détour','Kesari','Kūno + Budō'];
const flow = document.getElementById('flow');
const DUR = 11000, EVERY = 1500;
let n = 0;
function spawn(){
  const z = document.querySelector('.zero').getBoundingClientRect();
  const y0 = z.bottom + 8, y1 = innerHeight + 40;
  const el = document.createElement('span'); el.className = 'name'; el.textContent = NAMES[n++ % NAMES.length];
  flow.appendChild(el);
  const at = (t, y, o, b) => ({ offset: t, transform: `translate(-50%, ${y}px)`, opacity: o, filter: `blur(${b}px)` });
  const Y = t => y0 + (y1 - y0) * t;
  el.animate(reduce ? [at(0, Y(.3), 0, 0), at(.2, Y(.3), 1, 0), at(.8, Y(.3), 1, 0), at(1, Y(.3), 0, 0)] : [
    at(0,   Y(0),   0,  14),
    at(.22, Y(.12), 1,  0),     // blurry → clear
    at(.55, Y(.5),  1,  0),     // clear, sliding down slowly
    at(.85, Y(.85), .5, 8),     // blurs again
    at(1,   Y(1),   0,  16)     // gone below the screen
  ], { duration: DUR, easing: 'linear', fill: 'both' }).onfinish = () => el.remove();
}
spawn(); setInterval(spawn, EVERY);

/* the two 4s turn to look at the pointer */
const fours = [...document.querySelectorAll('.four')];
let tx = 0, ty = 0, cx = 0, cy = 0;
addEventListener('pointermove', e => { tx = e.clientX / innerWidth - .5; ty = e.clientY / innerHeight - .5; });
(function tilt(){
  cx += (tx - cx) * .08; cy += (ty - cy) * .08;
  fours.forEach((f, i) => {
    const r = f.getBoundingClientRect(), fx = (r.left + r.width / 2) / innerWidth - .5;   // each 4 looks from where it stands
    f.style.transform = `rotateY(${((cx - fx * .5) * 55).toFixed(2)}deg) rotateX(${(-cy * 30).toFixed(2)}deg)`;
  });
  requestAnimationFrame(tilt);
})();

/* rocket smoke: each 4 breathes smoke from the foot of its blade, with tiny numbers falling inside it */
const cv = document.getElementById('smoke'), g = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function size(){ dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0); }
size(); addEventListener('resize', size);
const puffs = [], digits = [];
function nozzle(f){ const r = f.getBoundingClientRect(); return { x: r.left + r.width * (395 - 30) / 500, y: r.top + r.height * (625 - 90) / 700, w: r.width }; }
let lastT = performance.now(), acc = 0;
function smoke(now){
  const dt = Math.min(50, now - lastT) / 16.7; lastT = now;
  if (!reduce){
    acc += dt;
    while (acc >= 1){ acc -= 1;
      for (const f of fours){
        const n = nozzle(f), s = n.w / 300;
        puffs.push({ x: n.x + (Math.random() - .5) * 18 * s, y: n.y, vx: (Math.random() - .5) * 1.1, vy: (1 + Math.random() * .9) * s, r: (12 + Math.random() * 10) * s, gr: (.45 + Math.random() * .35) * s, a: .1 + Math.random() * .08, life: 0, max: 150 + Math.random() * 80 });
        if (Math.random() < .22) digits.push({ x: n.x + (Math.random() - .5) * 40 * s, y: n.y + 6, vx: (Math.random() - .5) * 1.4, vy: (1.6 + Math.random() * 1.4) * s, d: '0123456789'[Math.random() * 10 | 0], sz: (10 + Math.random() * 9) * Math.max(.7, s), rot: (Math.random() - .5) * .6, vr: (Math.random() - .5) * .02, life: 0, max: 130 + Math.random() * 70 });
      }
    }
  }
  g.clearRect(0, 0, W, H);
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .995; p.r += p.gr * dt;
    const k = p.life / p.max; if (k >= 1 || p.y - p.r > H){ puffs.splice(i, 1); continue; }
    const a = p.a * Math.min(1, p.life / 12) * (1 - k);
    const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
    gr.addColorStop(0, `rgba(120,114,106,${a})`); gr.addColorStop(1, 'rgba(120,114,106,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = digits.length - 1; i >= 0; i--){
    const d = digits[i]; d.life += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
    const k = d.life / d.max; if (k >= 1 || d.y > H + 20){ digits.splice(i, 1); continue; }
    g.save(); g.translate(d.x, d.y); g.rotate(d.rot);
    g.globalAlpha = Math.min(1, d.life / 10) * (1 - k) * .85;
    g.font = `500 ${d.sz}px Jost, sans-serif`; g.fillStyle = '#16130F'; g.fillText(d.d, 0, 0); g.restore();
  }
  requestAnimationFrame(smoke);
}
requestAnimationFrame(smoke);

/* the home page cursor: an arrow that leans into its motion; buttons light up and take the click */
const cur = document.getElementById('cur'), curBody = document.getElementById('curBody');
const fine = matchMedia('(hover: hover) and (pointer: fine)').matches && !reduce;
let px = innerWidth / 2, py = innerHeight / 2, qx = px, qy = py, lx = 0, ly = 0, ang = 0, tAng = 0, speed = 0, lit = null;
const btns = [...document.querySelectorAll('.pill, .mark')];
const gapTo = (el, x, y) => { const r = el.getBoundingClientRect(); return Math.hypot(Math.max(r.left - x, 0, x - r.right), Math.max(r.top - y, 0, y - r.bottom)); };
function setLit(el){
  if (el === lit) return; if (lit) lit.classList.remove('is-lit'); lit = el;
  if (el){ el.classList.add('is-lit'); el.animate([{ filter: 'blur(0)' }, { filter: 'blur(3.5px)', offset: .35 }, { filter: 'blur(0)' }], { duration: 340, easing: 'ease-out' }); }
}
if (fine){
  document.documentElement.classList.add('has-cur');
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    qx = e.clientX; qy = e.clientY;
    if (Math.hypot(qx - lx, qy - ly) > .6) tAng = Math.atan2(qy - ly, qx - lx) * 180 / Math.PI;
    lx = qx; ly = qy;
    let best = null, bd = 28; for (const el of btns){ const d = gapTo(el, qx, qy); if (d < bd){ bd = d; best = el; } }
    setLit(best); cur.dataset.on = best ? 0 : 1;
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { cur.dataset.on = 0; setLit(null); });
  document.addEventListener('click', e => { if (lit && !lit.contains(e.target)){ e.preventDefault(); e.stopPropagation(); lit.click(); } }, true);
  (function loop(){
    const dx = qx - px, dy = qy - py, d = Math.hypot(dx, dy);
    px += dx * .2; py += dy * .2; speed += (d - speed) * .15;
    ang += (((tAng - ang + 540) % 360) - 180) * .16;
    cur.style.transform = `translate3d(${px}px, ${py}px, 0) rotate(${ang}deg)`;
    curBody.style.transform = `translate(-92%, -50%) scale(${1 + Math.min(speed / 600, .35)}, ${1 - Math.min(speed / 900, .18)})`;
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
